spring.application.name=bluewave

# ============ BANCO SQL SERVER (bd_bluewave.sql) ============
# Ajuste usuario/senha conforme sua instalação do SQL Server.
# Variáveis de ambiente com valor padrão: DB_USER / DB_PASSWORD
# (servidor "." = localhost)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bd_bluewave;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:jv24092009}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# "update" cria as tabelas que faltarem e mantém os dados (bom para desenvolvimento).
# Para a entrega, pode trocar por "none" e rodar só o bd_bluewave.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# As colunas do bd_bluewave usam camelCase (nivelAcesso, dataCadastro...),
# então desligamos a conversa automática para snake_case do Hibernate.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Porta da API
server.port=8080
